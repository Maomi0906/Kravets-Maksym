function hud(){$('#time').textContent='⏱ '+fmt(G.t);$('#time').classList.toggle('low',G.t<=15);const sc=$('#sc');if(sc.textContent!=G.score){sc.textContent=G.score;sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump')}$('#lv').textContent=G.lvl+1;$('#er').textContent='❌ Chyby: '+G.err}
function addT(s,lab){const b=G.t;G.t=Math.max(0,Math.min(MAXT,G.t+s));const d=Math.round(G.t-b);if(s>0&&d>0)floatTx('+'+d+'s','#4ade80');else if(s<0)floatTx(s+'s','#f87171')}
function buildBoard(){const n=LV[Math.min(G.lvl,7)],P=n/2,em=shuf(sp(TH[S.theme][2])).slice(0,P),cols=n<=4?2:n==6?3:n==30?5:4,b=$('#board');b.style.gridTemplateColumns=`repeat(${cols},1fr)`;b.innerHTML='';b.dataset.b=S.back||0;G.first=null;G.lock=false;G.left=P;G.cards=shuf([...em,...em]).map((e,i)=>{const c=document.createElement('div');c.className='card';c.style.animationDelay=i*20+'ms';c.innerHTML=`<div class="in"><div class="k">${BK[S.back||0][1]}</div><div class="f">${e}</div></div>`;c.style.setProperty('--h',(em.indexOf(e)*53)%360);c.onclick=()=>pick(o);const o={e,c,done:false};return o});G.cards.forEach(o=>{o.c.onclick=()=>pick(o);b.appendChild(o.c)})}
function pick(o){if(!G||G.over||G.paused||G.lock||o.done||o===G.first||o.c.classList.contains('open'))return;SFX.flip();o.c.classList.add('open');if(!G.first){G.first=o;return}const a=G.first;G.first=null;G.lock=true;if(a.e===o.e){setTimeout(()=>match(a,o),220)}else{G.err++;G.ec++;G.combo=0;G.score=Math.max(0,G.score-10);setTimeout(()=>{SFX.bad();a.c.classList.add('bad');o.c.classList.add('bad')},230);hud();comboUp();const d=G.lvl>=7?550:850;if(G.ec>=5){G.ec=0;setTimeout(scream,300)}else setTimeout(()=>{a.c.classList.remove('open','bad');o.c.classList.remove('open','bad');G.lock=false},d)}}
function match(a,o){if(G.over)return;a.done=o.done=true;a.c.classList.add('ok');o.c.classList.add('ok');a.c.classList.remove('glow');o.c.classList.remove('glow');SFX.ok();G.combo++;G.maxC=Math.max(G.maxC,G.combo);G.pairs++;S.pairs++;G.score+=100+20*(G.combo-1);addT(1);G.left--;comboUp();if(G.combo%5==0&&G.combo>=5)milestone(G.combo);const r=o.c.getBoundingClientRect();burst(8,['✨','⭐'],r.x+r.width/2,r.y+r.height/2);hud();if(G.left<=0){G.lock=true;setTimeout(nextLvl,550)}else G.lock=false}
function comboUp(){const c=$('#combo');if(G.combo>=2){c.textContent='🔥 COMBO ×'+G.combo;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');SFX.combo(Math.min(G.combo,12))}else{c.style.opacity=0;c.classList.remove('pop')}}
function milestone(c){const k=c>=15?['🔥😎🔥','NEZASTAVITELNÝ!']:c>=10?['🤩','SKVĚLÉ COMBO!']:['😎','DOBRÁ PRÁCE!'];addT(5);SFX.bonus();overlay('#mil',k[0],k[1]+' +5s',1300);burst(c>=10?40:18,c>=15?['🔥','🎉','⭐']:['🎉','✨','🎊'])}
function scream(){G.lock=true;SFX.bu();overlay('#scr',null,null,800);addT(-5);setTimeout(()=>{if(G.over)return;G.cards.forEach(o=>{if(!o.done)o.c.classList.remove('open','bad')});G.first=null;G.lock=false;hud()},850)}
function nextLvl(){if(G.over)return;const bonus=200+G.lvl*50+Math.max(0,Math.round((G.lvlStart-G.t)<10?100:0));G.score+=bonus;G.done++;S.levels++;G.lvl++;G.lvlStart=G.t;SFX.lvl();floatTx('LEVEL! +'+bonus,'#ffd23f');burst(14,['🎉','⭐']);buildBoard();hud()}
function useG(k){if(!G||G.over||G.paused||S.gad[k]<=0)return;if(k=='f'){if(G.lock)return;G.lock=true;G.cards.forEach(o=>{if(!o.done)o.c.classList.add('open')});$('#flash').classList.remove('go');void $('#flash').offsetWidth;$('#flash').classList.add('go');setTimeout(()=>{G.cards.forEach(o=>{if(!o.done&&o!==G.first)o.c.classList.remove('open')});G.lock=false},1000)}else if(k=='h'){const l=G.cards.filter(o=>!o.done&&!o.c.classList.contains('open'));if(!l.length)return;const e=l[Math.random()*l.length|0].e,p=l.filter(o=>o.e==e);p.forEach(o=>o.c.classList.add('glow'));setTimeout(()=>p.forEach(o=>o.c.classList.remove('glow')),1800)}else{addT(15);overlay('#mil','⏱','+15s',700)}S.gad[k]--;save();SFX.gad();gadUp()}
function gadUp(){$('#gad').innerHTML=Object.keys(GN).map(k=>`<button class="gd g-${k}" ${S.gad[k]<=0?'disabled':''} onclick="useG('${k}')"><span class="ic">${GI[k]}</span><span class="nm">${GN[k][1]}</span><i class="ct">${S.gad[k]}</i></button>`).join('')}
function pauseG(){if(!G||G.over)return;G.paused=true;modal(`<h2>⏸ Pauza</h2><button class="btn big" style="width:100%" onclick="resumeG()">▶ POKRAČOVAT</button><br><br><button class="btn alt" style="width:100%" onclick="quit()">🏠 Ukončit hru</button>`)}
function resumeG(){closeM();G.paused=false;G.last=performance.now()}
function quit(){closeM();G.over=true;clearInterval(tm);music(false);show('menu')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!G.paused&&$('#game').classList.contains('on'))pauseG()});
function end(){if(G.over)return;G.over=true;clearInterval(tm);music(false);SFX.end();const nr=G.score>S.best;if(nr)S.best=G.score;S.maxCombo=Math.max(S.maxCombo,G.maxC);save();burst(nr?40:0,['🏆','🎉','⭐']);setTimeout(()=>modal(`<h2 style="text-align:center;font-size:32px">ČAS VYPRŠEL!</h2>${nr?'<div class="big2" style="text-align:center;color:#ffd23f">🏆 NOVÝ REKORD!</div>':''}<div class="stat"><span>Skóre</span><b>${G.score}</b></div><div class="stat"><span>Nejlepší skóre</span><b>${S.best}</b></div><div class="stat"><span>Dokončené levely</span><b>${G.done}</b></div><div class="stat"><span>Nalezené dvojice</span><b>${G.pairs}</b></div><div class="stat"><span>Maximální combo</span><b>×${G.maxC}</b></div><div class="stat"><span>Počet chyb</span><b>${G.err}</b></div><br><button class="btn big" style="width:100%" onclick="closeM();start()">🔄 HRÁT ZNOVU</button><br><br><button class="btn alt" style="width:100%" onclick="closeM();show('menu')">🏠 HLAVNÍ MENU</button>`),600)}
/* roulette */
const SEG=[['f',1],['h',1],['t',1],['f',2],['h',2],['t',2]],WT=[24,24,14,16,16,6];
let rot=0,spun=false;
function roulette(){const can=S.lastSpin!=today();modal(`<h2 style="text-align:center">🎁 Denní ruleta</h2><div id="wheelw"><div id="ptr"></div><div id="wheel">${SEG.map((s,i)=>`<i style="transform:rotate(${i*60+30}deg)"><span>${GI[s[0]]}<b>×${s[1]}</b></span></i>`).join('')}</div></div><div id="rres" class="big2" style="text-align:center">${can?'Zatoč jednou denně zdarma!':'Dnes už jsi točil/a. Přijď zítra! 🌙'}</div><button class="btn big" id="spinb" style="width:100%;font-size:22px" ${can?'':'disabled'} onclick="spin()">ZATOČIT</button><br><br><button class="btn alt" style="width:100%" onclick="closeM();menuUp()">Zavřít</button>`);rot=0}
function spin(){if(S.lastSpin==today())return;S.lastSpin=today();save();$('#spinb').disabled=true;let r=Math.random()*100,i=0;for(;i<6;i++){r-=WT[i];if(r<0)break}i=Math.min(i,5);rot+=360*6+(360-(i*60+30));$('#wheel').style.transform=`rotate(${rot}deg)`;let k=0;const tk=setInterval(()=>{SFX.tick();if(++k>26)clearInterval(tk)},120);setTimeout(()=>{const key=SEG[i][0],n=SEG[i][1];S.gad[key]+=n;save();SFX.bonus();burst(30,['✨','⭐']);$('#rres').innerHTML='GRATULUJEME!<br><span class="chip g-'+key+'" style="margin-top:8px"><span class="ic">'+GI[key]+'</span>'+GN[key][1]+' ×'+n+'</span>';menuUp()},4200)}
function spinOld(){if(S.lastSpin==today())return;S.lastSpin=today();save();$('#spinb').disabled=true;let r=Math.random()*100,i=0;for(;i<6;i++){r-=WT[i];if(r<0)break}i=Math.min(i,5);rot+=360*6+(360-(i*60+30));$('#wheel').style.transform=`rotate(${rot}deg)`;let k=0;const tk=setInterval(()=>{SFX.tick();if(++k>26)clearInterval(tk)},120);setTimeout(()=>{let t='';const g=S.gad,rnd=()=>['f','h','t'][Math.random()*3|0];if(i<3){const key=['f','h','t'][i];g[key]++;t=GN[key][0]+' '+GN[key][1]+' ×1'}else if(i==3){const a=rnd(),b=rnd();g[a]++;g[b]++;t=GN[a][0]+' '+GN[a][1]+' + '+GN[b][0]+' '+GN[b][1]}else if(i==4){g.f++;g.h++;g.t++;t='👁💡⏱ ×1 každý'}else{g.h+=2;t='💡 Nápověda ×2'}save();SFX.bonus();burst(30,['🎉','⭐','✨']);$('#rres').innerHTML='GRATULUJEME!<br><small>Získali jste: '+t+'</small>';menuUp()},4200)}
menuUp();
</script></body></html>
