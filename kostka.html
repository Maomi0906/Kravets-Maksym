<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2027">
<title>KOSTKA – hod kostkami</title>
<style>
:root{--b1:#0f2027;--b2:#2c7da0;--ac:#4cc9f0;--dice:#ffffff;--pip:#1e2a44;--glass:rgba(255,255,255,.12);--line:rgba(255,255,255,.18);--tx:#fff;--tx2:rgba(255,255,255,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;color:var(--tx);background:linear-gradient(150deg,var(--b1),var(--b2));display:flex;justify-content:center;overflow-x:hidden;transition:background .6s}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s;z-index:0}
#bg.on{opacity:1}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;background:var(--ac);z-index:0;animation:drift 14s ease-in-out infinite alternate;transition:background .6s}
.orb.o1{width:320px;height:320px;top:-80px;left:-80px}
.orb.o2{width:260px;height:260px;bottom:-60px;right:-60px;animation-delay:-7s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.2)}}
.app{position:relative;z-index:1;width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.logo{font-size:26px;font-weight:900;letter-spacing:.14em}
.logo i{font-style:normal;color:var(--ac);transition:color .6s}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);font-size:20px;cursor:pointer;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.9)}
main{flex:1;position:relative}
.panel{display:none;animation:fade .35s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.card h2{font-size:15px;margin:0 0 12px;font-weight:700}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--tx);font-size:22px;cursor:pointer;transition:transform .15s}
.stepper button:active{transform:scale(.85)}
.stepper span{min-width:110px;text-align:center;font-weight:700}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--s)*.22);min-height:230px;padding:20px 4px;--k:1}
.die{width:calc(var(--s)*var(--k));height:calc(var(--s)*var(--k));position:relative;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--s)*var(--k)*.14);background:var(--dice);border-radius:22%;box-shadow:0 calc(var(--s)*.1) calc(var(--s)*.22) rgba(0,0,0,.35),inset 0 -6px 10px rgba(0,0,0,.12),inset 0 3px 6px rgba(255,255,255,.6);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
.p{width:calc(var(--s)*var(--k)*.19);height:calc(var(--s)*var(--k)*.19);border-radius:50%;align-self:center;justify-self:center;background:var(--pip);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.p.on{transform:scale(1)}
.d-round .die{border-radius:34%;box-shadow:0 calc(var(--s)*.08) calc(var(--s)*.18) rgba(0,0,0,.3)}
.d-neon .die{background:#0a0e1f;border:2px solid var(--dice);box-shadow:0 0 18px var(--dice),inset 0 0 14px color-mix(in srgb,var(--dice) 45%,transparent)}
.d-neon .p{background:var(--dice);box-shadow:0 0 10px var(--dice)}
.d-glass .die{background:color-mix(in srgb,var(--dice) 38%,transparent);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 0 14px rgba(255,255,255,.35)}
.d-glass .p{box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sum{text-align:center;margin:2px 0 12px}
.sum small{display:block;color:var(--tx2);font-size:14px}
.sum b{font-size:60px;line-height:1.05;font-weight:900;display:inline-block}
.sum b.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.3);color:var(--ac)}}
.vals{color:var(--tx2);font-size:14px;min-height:20px;margin-top:2px}
.roll{width:100%;border:0;border-radius:20px;padding:18px;font:inherit;font-size:19px;font-weight:800;color:#0b1220;background:linear-gradient(135deg,var(--ac),#fff);cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.28);transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden}
.roll:active{transform:scale(.96)}
.roll:disabled{opacity:.7}
.roll::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{left:130%}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--tx);border-radius:14px;padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;transition:all .2s}
.chip.sel{background:var(--ac);color:#0b1220;border-color:transparent;font-weight:700;transform:scale(1.04)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .2s;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.sw button.sel{border-color:#fff;transform:scale(1.15)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
.row label{font-size:14px}
input[type=color]{width:56px;height:36px;border:2px solid var(--line);border-radius:12px;background:none;padding:0;cursor:pointer}
.btn2{border:1px solid var(--line);background:var(--glass);color:var(--tx);border-radius:14px;padding:12px 16px;font:inherit;font-size:14px;cursor:pointer;transition:transform .15s}
.btn2:active{transform:scale(.95)}
.hist{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);animation:fade .3s}
.hist li:last-child{border:0}
.hist time{font-size:12px;color:var(--tx2);min-width:42px}
.hist .v{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.hist .v span{min-width:26px;height:26px;border-radius:8px;background:var(--dice);color:var(--pip);font-weight:800;font-size:13px;display:grid;place-items:center}
.hist .t{font-weight:800;font-size:18px}
.empty{text-align:center;color:var(--tx2);padding:26px 8px;font-size:14px}
.kpi{display:flex;gap:10px;margin-bottom:12px}
.kpi div{flex:1;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 4px}
.kpi b{display:block;font-size:24px}
.kpi small{color:var(--tx2);font-size:12px}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.bar .n{width:24px;height:24px;border-radius:8px;background:var(--dice);color:var(--pip);font-weight:800;display:grid;place-items:center}
.bar .tr{flex:1;height:14px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--ac),#fff);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.bar .c{width:78px;text-align:right;color:var(--tx2);font-size:13px}
nav{display:flex;gap:6px;padding:6px;margin-top:6px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;bottom:6px}
nav button{flex:1;border:0;background:none;color:var(--tx2);font:inherit;font-size:12px;padding:8px 2px;border-radius:18px;cursor:pointer;transition:all .25s}
nav button span{display:block;font-size:20px}
nav button.active{background:rgba(255,255,255,.2);color:var(--tx);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,30px);background:rgba(10,14,31,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.stage{--k:.86}.sum b{font-size:52px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="bg"></div><div class="orb o1"></div><div class="orb o2"></div>
<div class="app">
  <header>
    <div class="logo">KOST<i>K</i>A</div>
    <button class="icon-btn" id="sndBtn" aria-label="Zapnout nebo vypnout zvuk">🔊</button>
  </header>

  <main>
    <section class="panel active" id="p-hod">
      <div class="stepper">
        <button id="minus" aria-label="Méně kostek">−</button>
        <span id="cntLbl"></span>
        <button id="plus" aria-label="Více kostek">+</button>
      </div>
      <div class="stage" id="stage"></div>
      <div class="sum"><small>Součet</small><b id="sum">0</b><div class="vals" id="vals"></div></div>
      <button class="roll" id="roll">Hodit kostkami</button>
    </section>

    <section class="panel" id="p-vzhled">
      <div class="card"><h2>Motivy</h2><div class="chips" id="themes"></div></div>
      <div class="card"><h2>Design kostek</h2><div class="chips" id="designs"></div></div>
      <div class="card"><h2>Barvy</h2>
        <div class="row"><label for="cDice">Barva kostek</label><input type="color" id="cDice"></div>
        <div class="row"><label for="cPip">Barva teček</label><input type="color" id="cPip"></div>
      </div>
      <div class="card"><h2>Vlastní pozadí</h2>
        <div class="chips">
          <button class="btn2" id="upBtn">Nahrát obrázek</button>
          <button class="btn2" id="upDel">Odebrat obrázek</button>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </section>

    <section class="panel" id="p-historie">
      <div class="card"><h2>Poslední hody</h2><ul class="hist" id="hist"></ul>
        <div style="margin-top:12px"><button class="btn2" id="clrHist">Vymazat historii</button></div></div>
    </section>

    <section class="panel" id="p-stat">
      <div class="kpi">
        <div><b id="kRolls">0</b><small>hodů</small></div>
        <div><b id="kDice">0</b><small>kostek</small></div>
        <div><b id="kAvg">0</b><small>průměrný součet</small></div>
      </div>
      <div class="card"><h2>Četnost čísel</h2><div id="bars"></div>
        <div style="margin-top:12px"><button class="btn2" id="clrStat">Vynulovat statistiky</button></div></div>
    </section>
  </main>

  <nav id="nav">
    <button data-t="hod" class="active"><span>🎲</span>Hod</button>
    <button data-t="vzhled"><span>🎨</span>Vzhled</button>
    <button data-t="historie"><span>🕘</span>Historie</button>
    <button data-t="stat"><span>📊</span>Statistiky</button>
  </nav>
</div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const THEMES=[
 {n:'Oceán',b1:'#0f2027',b2:'#2c7da0',ac:'#4cc9f0',dice:'#ffffff',pip:'#16324f'},
 {n:'Západ slunce',b1:'#ff7e5f',b2:'#6a3093',ac:'#ffd166',dice:'#fff4e6',pip:'#5a1e5e'},
 {n:'Les',b1:'#0b3d2e',b2:'#2f9e6b',ac:'#8ef0b5',dice:'#f1fff6',pip:'#0b3d2e'},
 {n:'Noc',b1:'#0d0d1f',b2:'#2b2b5e',ac:'#fbc531',dice:'#fbc531',pip:'#0d0d1f'},
 {n:'Cukrová vata',b1:'#f6a6c1',b2:'#8e7cf0',ac:'#ff6fa5',dice:'#ffffff',pip:'#d6336c'}
];
const DESIGNS=['Klasická','Zaoblená','Neon','Sklo'],DCLS=['d-classic','d-round','d-neon','d-glass'];
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DEF={count:2,theme:0,design:0,dice:THEMES[0].dice,pip:THEMES[0].pip,sound:true,bg:null};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let S=Object.assign({},DEF,ld('kostka-s',{}));
let H=ld('kostka-h',[]);
let ST=ld('kostka-st',{rolls:0,dice:0,sum:0,c:[0,0,0,0,0,0]});
let vals=[],rolling=false,shown=0,ac;

/* ---------- pomocné ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function plural(n){return n===1?'kostka':n<5?'kostky':'kostek'}
const save=()=>sv('kostka-s',S);

/* ---------- zvuk ---------- */
function ctx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function beep(f,when,dur,vol,type){if(!S.sound)return;try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.02)}catch(e){}}
function rollSound(){for(let i=0;i<9;i++)beep(140+Math.random()*260,i*.085+Math.random()*.03,.05,.16,'square')}
function doneSound(){beep(660,0,.18,.18);beep(880,.1,.28,.18)}

/* ---------- vzhled ---------- */
function applyLook(){
  const t=THEMES[S.theme],r=document.documentElement.style;
  r.setProperty('--b1',t.b1);r.setProperty('--b2',t.b2);r.setProperty('--ac',t.ac);
  r.setProperty('--dice',S.dice);r.setProperty('--pip',S.pip);
  document.querySelector('meta[name=theme-color]').content=t.b1;
  $('#stage').className='stage '+DCLS[S.design];
  const bg=$('#bg');bg.style.backgroundImage=S.bg?`url(${S.bg})`:'none';bg.classList.toggle('on',!!S.bg);
  $('#sndBtn').textContent=S.sound?'🔊':'🔇';
  $('#cDice').value=S.dice;$('#cPip').value=S.pip;
  document.querySelectorAll('#themes .sel,#designs .sel').forEach(e=>e.classList.remove('sel'));
  $('#themes').children[S.theme].classList.add('sel');$('#designs').children[S.design].classList.add('sel');
}
function buildChoices(){
  THEMES.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=t.n;
    b.style.backgroundImage=`linear-gradient(135deg,${t.b1},${t.b2})`;b.style.color='#fff';
    b.onclick=()=>{S.theme=i;S.dice=t.dice;S.pip=t.pip;save();applyLook()};$('#themes').appendChild(b)});
  DESIGNS.forEach((n,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;
    b.onclick=()=>{S.design=i;save();applyLook()};$('#designs').appendChild(b)});
}

/* ---------- kostky ---------- */
function dieEl(v){const d=document.createElement('div');d.className='die';for(let i=0;i<9;i++){const p=document.createElement('i');p.className='p';d.appendChild(p)}setFace(d,v);return d}
function setFace(d,v){d.dataset.v=v;[...d.children].forEach((p,i)=>p.classList.toggle('on',PIPS[v].includes(i)))}
function sizeFor(n){return n<=2?104:n<=4?88:n<=6?76:66}
function renderDice(){
  const st=$('#stage');st.style.setProperty('--s',sizeFor(S.count)+'px');
  while(vals.length<S.count)vals.push(1+Math.floor(Math.random()*6));
  vals.length=S.count;
  st.innerHTML='';vals.forEach(v=>st.appendChild(dieEl(v)));
  $('#cntLbl').textContent=S.count+' '+plural(S.count);
  showSum(false);
}
function showSum(anim){
  const total=vals.reduce((a,b)=>a+b,0),el=$('#sum'),from=shown;shown=total;
  $('#vals').textContent=vals.length>1?vals.join(' + ')+' = '+total:'';
  if(!anim){el.textContent=total;return}
  const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/450);el.textContent=Math.round(from+(total-from)*k);if(k<1)requestAnimationFrame(f)})(t0);
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
}
function roll(){
  if(rolling)return;rolling=true;
  const btn=$('#roll');btn.disabled=true;rollSound();
  const dice=[...$('#stage').children],final=dice.map(()=>1+Math.floor(Math.random()*6));
  const dur=950;
  dice.forEach((d,i)=>{
    const dir=Math.random()<.5?-1:1,r=dir*360*(1+Math.floor(Math.random()*2)),dx=(Math.random()-.5)*90;
    d.animate([
      {transform:'translate(0,0) rotate(0) scale(1)'},
      {transform:`translate(${dx}px,-70px) rotate(${r*.45}deg) scale(1.2)`,offset:.35},
      {transform:`translate(${-dx*.4}px,0) rotate(${r*.85}deg) scale(.9)`,offset:.7},
      {transform:`translate(0,0) rotate(${r}deg) scale(1)`}
    ],{duration:dur+i*70,easing:'cubic-bezier(.3,.7,.4,1)'});
  });
  const fl=setInterval(()=>dice.forEach(d=>setFace(d,1+Math.floor(Math.random()*6))),75);
  setTimeout(()=>{
    clearInterval(fl);vals=final;dice.forEach((d,i)=>setFace(d,final[i]));
    const total=final.reduce((a,b)=>a+b,0);
    ST.rolls++;ST.dice+=final.length;ST.sum+=total;final.forEach(v=>ST.c[v-1]++);
    const now=new Date();
    H.unshift({t:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),v:final,s:total});H=H.slice(0,15);
    sv('kostka-h',H);sv('kostka-st',ST);
    showSum(true);renderHist();renderStats();doneSound();
    btn.textContent='Hodit znovu';btn.disabled=false;rolling=false;
  },dur+dice.length*70);
}

/* ---------- historie a statistiky ---------- */
function renderHist(){
  const ul=$('#hist');
  if(!H.length){ul.innerHTML='<li class="empty" style="display:block">Zatím žádné hody. Hoďte kostkami a zobrazí se tady.</li>';return}
  ul.innerHTML=H.map(h=>`<li><time>${h.t}</time><div class="v">${h.v.map(x=>`<span>${x}</span>`).join('')}</div><div class="t">${h.s}</div></li>`).join('');
}
function renderStats(){
  $('#kRolls').textContent=ST.rolls;$('#kDice').textContent=ST.dice;
  $('#kAvg').textContent=ST.rolls?(ST.sum/ST.rolls).toFixed(1).replace('.',','):'0';
  const max=Math.max(1,...ST.c);
  $('#bars').innerHTML=ST.c.map((c,i)=>`<div class="bar"><div class="n">${i+1}</div><div class="tr"><div class="fl" style="width:${c/max*100}%"></div></div><div class="c">${c}× (${ST.dice?Math.round(c/ST.dice*100):0} %)</div></div>`).join('');
}

/* ---------- pozadí z obrázku ---------- */
function loadImage(f){
  if(!f)return;
  if(!f.type.startsWith('image/')){toast('Vyberte prosím soubor s obrázkem.');return}
  const fr=new FileReader();
  fr.onerror=()=>toast('Obrázek se nepodařilo načíst.');
  fr.onload=()=>{const im=new Image();
    im.onerror=()=>toast('Obrázek se nepodařilo načíst.');
    im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.bg=c.toDataURL('image/jpeg',.78);applyLook();
      toast(save()?'Pozadí bylo nastaveno.':'Pozadí platí jen do zavření stránky (obrázek je příliš velký pro uložení).');};
    im.src=fr.result};
  fr.readAsDataURL(f);
}

/* ---------- události ---------- */
$('#roll').onclick=roll;
$('#plus').onclick=()=>{if(S.count>=10){toast('Maximální počet je 10 kostek.');return}S.count++;save();renderDice()};
$('#minus').onclick=()=>{if(S.count<=1){toast('Minimální počet je 1 kostka.');return}S.count--;save();renderDice()};
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();applyLook();toast(S.sound?'Zvuk je zapnutý.':'Zvuk je vypnutý.');if(S.sound)beep(660,0,.15,.15)};
$('#cDice').oninput=e=>{S.dice=e.target.value;save();applyLook()};
$('#cPip').oninput=e=>{S.pip=e.target.value;save();applyLook()};
$('#upBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{loadImage(e.target.files[0]);e.target.value=''};
$('#upDel').onclick=()=>{if(!S.bg){toast('Vlastní pozadí není nastaveno.');return}S.bg=null;save();applyLook();toast('Pozadí bylo odebráno.')};
$('#clrHist').onclick=()=>{H=[];sv('kostka-h',H);renderHist();toast('Historie byla vymazána.')};
$('#clrStat').onclick=()=>{ST={rolls:0,dice:0,sum:0,c:[0,0,0,0,0,0]};sv('kostka-st',ST);renderStats();toast('Statistiky byly vynulovány.')};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p-'+b.dataset.t));
  if(b.dataset.t==='stat')renderStats()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&$('#p-hod').classList.contains('active')&&!/INPUT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();roll()}});
['dragover','drop'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();if(n==='drop')loadImage(e.dataTransfer.files[0])}));

buildChoices();applyLook();renderDice();renderHist();renderStats();
</script>
</body>
</html>
